[project]
name = "codebase-cartographer"
version = "0.1.0"
description = "Map a Python codebase into a navigable dependency graph, with an evaluated structural analysis and optional LLM narration."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "litellm>=1.89.2",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codemap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]~
